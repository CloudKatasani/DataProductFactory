# pnpm blocks dependency build scripts unless they are allowed here.
# Each entry is a package whose postinstall we actually need:
#   prisma / @prisma/*   download and place the query engine
#   esbuild, unrs-resolver, sharp   install prebuilt platform binaries
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
